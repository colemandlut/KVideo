# Cloudflare Pages Wrangler Configuration
# This file provides compatibility settings for Cloudflare Pages deployment.
# It ensures nodejs_compat is always set, so users don't need to configure it manually.

name = "kvideo"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Environment variables can be set here or in Cloudflare Dashboard

# Cast relay. The Durable Object class itself lives in workers/cast-room -
# Cloudflare does not allow one to be defined inside a Pages project, so this
# only binds to it. Deploy that Worker first; until then the binding is absent
# and the cast API falls back to the Redis mailbox on its own.
[[durable_objects.bindings]]
name = "CAST_ROOM"
class_name = "CastRoom"
script_name = "kvideo-cast-room"
