# Cast relay Worker. Deployed separately from the Pages project, because
# Cloudflare does not allow a Durable Object class to be defined inside a
# Pages project - Pages can only bind to one that lives in a Worker.
#
# Deploy:  cd workers/cast-room && npx wrangler deploy
#
# This Worker IS publicly reachable, and has to be: the TV's WebSocket cannot
# be served from the Pages app (next-on-pages cannot return a 101 upgrade from
# a Next route handler). It authenticates callers itself with a signed
# short-lived ticket the Pages app issues - see src/index.ts. Nothing here
# trusts a client-supplied profileId.
#
# Set the shared secret with:  npx wrangler secret put CAST_TICKET_SECRET
name = "kvideo-cast-room"
main = "src/index.ts"
compatibility_date = "2025-04-01"

workers_dev = true

[[migrations]]
tag = "v1"
# SQLite-backed classes are the only kind available on the Workers Free plan.
# This relay stores nothing, but the backend still has to be declared.
new_sqlite_classes = ["CastRoom"]

# Lets the Worker address its own namespace; the Pages project declares its own
# binding to this same class in the root wrangler.toml.
[[durable_objects.bindings]]
name = "CAST_ROOM"
class_name = "CastRoom"
